name: Build and Test

on:
  push:
    branches-ignore: ['gh-pages']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions: {}

env:
  HUSKY: 0
  PNPM_VERSION: '11'
  NODE_VERSION: '26'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm ⚙️
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: 'node@${{ env.NODE_VERSION }}'
          cache: 'true'
          install: 'true'

      - name: Clean-up 🧹
        run: pnpm clean

      - name: Lint 🧐
        run: pnpm eslint . --max-warnings 0

      - name: Build 🔧
        run: pnpm build

      - name: Test 🧪
        run: pnpm test
